# Fallback semantic paths for standalone sw-browser-tester execution.
version: 1

paths:
  config_file: _context/config.yaml
  config_user_file: _context/config.user.yaml

  evidence:
    manifest: knowledge/designs/{requirement_id}/manifest.yaml
    e2e_design: knowledge/designs/{requirement_id}/e2e/design.md
    e2e_gate: knowledge/designs/{requirement_id}/e2e/gate.md
    browser_test_plan: skills/sw-browser-tester/references/browser-test-plan.md
    webbridge_test_template: skills/sw-browser-tester/references/webbridge-test-template.md
    webbridge_evidence_strategy: skills/sw-browser-tester/references/webbridge-evidence-strategy.md
    webbridge_visual_evidence: skills/sw-browser-tester/references/webbridge-visual-evidence.md
    tracker: knowledge/requirements-tracker.yaml

  artifact_targets:
    test_root: knowledge/requirements/{requirement_id}/test-artifacts/e2e
    session_log: knowledge/requirements/{requirement_id}/test-artifacts/e2e/browser-e2e-session.json
    output_dir: knowledge/requirements/{requirement_id}/test-artifacts/e2e/output
    network_log: knowledge/requirements/{requirement_id}/test-artifacts/e2e/network.json
    visual_evidence_dir: knowledge/requirements/{requirement_id}/test-artifacts/e2e/visual
    result_file: knowledge/requirements/{requirement_id}/browser-e2e-results.yaml
    tracker: knowledge/requirements-tracker.yaml
