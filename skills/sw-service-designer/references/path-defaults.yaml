# Fallback semantic paths for standalone sw-service-designer execution.
# Call-time paths and project configuration take precedence.
version: 1

paths:
  config_file: _context/config.yaml
  config_user_file: _context/config.user.yaml

  definition_roots:
    project: knowledge/templates
    user: null
    skill: skills/sw-service-designer/references/document-definitions

  evidence:
    requirement_document: knowledge/requirements/{requirement_id}/requirement.md
    requirements_gate_report: knowledge/requirements/{requirement_id}/gate.md
    bundle_manifest: knowledge/designs/{requirement_id}/manifest.yaml
    feature_design: knowledge/designs/{requirement_id}/feature-design.md
    feature_gate_report: knowledge/designs/{requirement_id}/feature-design-gate.md
    context_files:
      - knowledge/CONTEXT.md
    context_maps:
      - knowledge/CONTEXT-MAP.md
    decision_roots:
      - knowledge/decisions
    pattern_roots:
      - knowledge/patterns
    lesson_roots:
      - knowledge/lessons
    contract_roots:
      - knowledge/contracts
    service_registry: knowledge/service-registry.yaml
    service_roots: services
    service_knowledge_root: knowledge/services/{service_id}

  artifact_targets:
    design_dir: knowledge/designs/{requirement_id}/services/{service_id}
    design_document: knowledge/designs/{requirement_id}/services/{service_id}/design.md
    gate_report: knowledge/designs/{requirement_id}/services/{service_id}/gate.md
    pre_query: knowledge/designs/{requirement_id}/services/{service_id}/pre-query.md
    api_collection: knowledge/designs/{requirement_id}/services/{service_id}/tests/collection.json
    api_environment: knowledge/designs/{requirement_id}/services/{service_id}/tests/environment.json
    api_data: knowledge/designs/{requirement_id}/services/{service_id}/tests/data.json
    api_report: knowledge/designs/{requirement_id}/services/{service_id}/tests/report.xml
    bundle_manifest: knowledge/designs/{requirement_id}/manifest.yaml
    tracker: knowledge/requirements-tracker.yaml
